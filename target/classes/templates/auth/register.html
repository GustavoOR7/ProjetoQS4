<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar - Biblioteca Pessoal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

    <main class="container auth-page">
        <section class="card auth-card">
            <h1>Criar conta</h1>
            <p class="muted">Cadastre-se para gerenciar seus livros.</p>

            <form th:action="@{/register}" th:object="${registrationForm}" method="post" class="form">
        <div class="alert error"
            th:if="${#fields.hasGlobalErrors()}"
            th:each="error : ${#fields.globalErrors()}"
            th:text="${error}">
        </div>

    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <label for="name">Nome</label>
            <input id="name" th:field="*{name}" type="text" required autocomplete="name">
            <small class="field-error" th:errors="*{name}"></small>

            <label for="email">E-mail</label>
            <input id="email" th:field="*{email}" type="email" required autocomplete="email">
            <small class="field-error" th:errors="*{email}"></small>

            <label for="password">Senha</label>
            <input id="password" th:field="*{password}" type="password" required autocomplete="new-password">
            <small class="hint">Use pelo menos 8 caracteres, com maiúscula, minúscula e número.</small>
            <small class="field-error" th:errors="*{password}"></small>

            <label for="confirmPassword">Confirmar senha</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" required autocomplete="new-password">
            <small class="field-error" th:errors="*{confirmPassword}"></small>

            <button type="submit" class="button primary full-width">Criar conta</button>
        </form>

        <p class="center">
            Já tem conta?
            <a th:href="@{/login}">Entrar</a>
        </p>
    </section>
</main>
</body>
</html>
