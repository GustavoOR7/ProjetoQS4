spring:
  application:
    name: biblioteca-pessoal

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/biblioteca_pessoal}

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: BIBLIOTECA_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    br.edu.qualidade.biblioteca: DEBUG
    br.edu.qualidade.biblioteca.security: TRACE
    org.springframework.security: TRACE 

---
spring:
  config:
    activate:
      on-profile: codespaces

server:
  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true
        same-site: none