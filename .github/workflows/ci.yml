name: CI - Biblioteca Pessoal

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-test-coverage:
    name: Build, Tests, Testcontainers and JaCoCo
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: -Xmx1024m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run full verification with tests and coverage
        run: mvn -B clean verify

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: target/site/jacoco
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: warn

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-test-coverage

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      MAVEN_OPTS: -Xmx1024m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and SonarQube analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.host.url="${SONAR_HOST_URL}"

      - name: Skip SonarQube analysis when secrets are missing
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: |
          echo "SonarQube analysis skipped."
          echo "Configure SONAR_TOKEN and SONAR_HOST_URL in GitHub repository secrets."